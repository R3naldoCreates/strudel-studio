[package]
name = "strudel-studio"
version = "0.1.2"
edition = "2021"
description = "Strudel Studio — a click-to-compose desktop interface for Strudel (offline, AGPL-3.0)"
rust-version = "1.77"
authors = ["Strudel Studio contributors"]
license = "AGPL-3.0-or-later"

[lib]
name = "strudel_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
